[project]
name = "medical-literature-orchestrator"
version = "0.1.0"
description = "Deterministic medical literature search and evidence provenance layer"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
medlit = "medlit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
