  platform: VERIFY_REQUIRED
  reference_gene: VERIFY_REQUIRED
  efficiency_correction: VERIFY_REQUIRED
evidence_policy: {verified_source_required_for_formal_citation: true}
provenance: {required: true, manifest: provenance/run-manifest.yaml, hash_algorithm: sha256}
