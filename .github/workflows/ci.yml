name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Synthetic smoke
        run: python examples/synthetic/run_synthetic_smoke.py
      - name: Public release audit
        run: python scripts/public_release_audit.py --strict --json
