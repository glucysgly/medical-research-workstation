schema_version: 1
stages:
  - IDEA
  - QUESTION
  - LITERATURE
  - PROTOCOL
  - DATA_INTAKE
  - DATA_QC
  - ANALYSIS_PLAN
  - ANALYSIS
  - RESULTS_QC
  - INTERPRETATION
