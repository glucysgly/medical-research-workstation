name: Public release audit

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Scan public tree
        run: python scripts/public_release_audit.py --strict --json
